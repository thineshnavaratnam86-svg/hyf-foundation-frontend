<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hyfBay | Find Your Next Deal</title>
    <link rel="stylesheet" href="hyfBay.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo">
          <span class="h">h</span><span class="y">y</span
          ><span class="f">f</span><span class="bay">Bay</span>
        </h1>
        <p class="tagline">Simple, fast, and fair local marketplace</p>
      </div>
    </header>

    <main class="container">
      <section class="controls" aria-label="Search and filter products">
        <div class="control-group search-group">
          <label for="search-input">Search products</label>
          <input
            type="text"
            id="search-input"
            placeholder="e.g. Smartphone, Monitor, Camera..."
          />
        </div>

        <div class="control-group">
          <label for="max-price">Max Price (DKK)</label>
          <input type="number" id="max-price" placeholder="e.g. 5000" min="0" />
        </div>

        <div class="control-group">
          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="default">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating-desc">Highest Rated</option>
          </select>
        </div>
      </section>

      <section class="results-section">
        <p id="results-count" class="results-count"></p>
        <ul id="product-list" class="product-list"></ul>
      </section>
    </main>

    <script src="hyfBayHelpers.js"></script>
    <script src="hyfBay.js"></script>
  </body>
</html>
